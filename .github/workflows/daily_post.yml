name: Daily Instagram Post

on:
  schedule:
    - cron: "0 9 * * *"  # Her gün 09:00 UTC = 12:00 Türkiye saati
  workflow_dispatch:      # Manuel tetikleme butonu

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install requests anthropic

      - name: Görseli paylaş
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          LONG_LIVED_USER_TOKEN: ${{ secrets.LONG_LIVED_USER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python post.py

      - name: Değişiklikleri kaydet (posted klasörü)
        run: |
          git config --global user.name "ZerayArt Bot"
          git config --global user.email "action@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Paylaşım yapıldı [$(date +'%Y-%m-%d')]"
          git push
